server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/projet_pfa}
    username: ${SPRING_DATASOURCE_USERNAME:ecommerce}
    password: ${SPRING_DATASOURCE_PASSWORD:ecommerce}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      "[hibernate.format_sql]": true
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    # Clé de signature HMAC — à surcharger en prod via la variable d'env APP_JWT_SECRET.
    secret: ${APP_JWT_SECRET:reforge-dev-secret-change-me-in-production-please-0123456789}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
